<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mode 2 – Static Accessibility Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- 2. CSS File Link karein -->
  <link rel="stylesheet" href="Modal.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Your Custom CSS (Logic styles) -->
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --brand: #fd7e14;
      --blue: #1d4ed8;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #fd7e14, #fffaf2);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ===== Navbar ===== */
    .navbar {
      background: linear-gradient(to right, #fd7e14, #fffaf2);
      width: 100%;
    }

    .logo-box {
      display: flex;
      align-items: center;
    }

    .logo-img {
      margin-top: -20px;
      width: 110px;
      height: 60px;
    }

    .logo-text {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text span {
      font-weight: bolder;
      font-size: 10px;
      padding: 4px;
      color: white;
    }

    .logo-ada {
      background-color: var(--blue);
      border-radius: 4px 0 0 4px;
    }

    .logo-scanner {
      background-color: #f97316;
      border-radius: 0 4px 4px 0;
    }

    .btn-dashboard {
      font-weight: bold;
      height: 40px;
      width: 110px;
      border-radius: 9999px;
      color: #fefcfb;
      background-color: #fb923c;
      border: none;
      border-right: 3px solid transparent;
      transition: all 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-dashboard:hover {
      color: #fb923c;
      background-color: var(--blue);
      border-right: 9px solid #fb923c;
    }

    .btn-dashboard2 {
      font-weight: bold;
      height: 40px;
      width: 180px;
      border-radius: 9999px;
      color: #fefcfb;
      background-color: #fb923c;
      border: none;
      border-right: 3px solid transparent;
      transition: all 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-dashboard2:hover {
      color: #fb923c;
      background-color: var(--blue);
      border-right: 9px solid #fb923c;
    }

    /* ===== Scanner Card ===== */
    .scanner-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .scanner-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 40px;
      max-width: 900px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .scanner-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(to right, var(--blue), var(--brand));
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
    }

    .subtitle {
      font-size: 16px;
      color: var(--black);
      
    }

    /* Input */
    .form-control {
      border-radius: 12px;
      padding: 12px 20px;
      border: 2px solid #e9ecef;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 0.25rem rgba(253, 126, 20, 0.25);
    }

    /* Scan Button */
    .btn-scan {
      font-weight: bold;
      height: 50px;
      padding: 10px 35px;
      border-radius: 9999px;
      color: #fff;
      background-color: var(--brand);
      border: none;
      border-right: 3px solid transparent;
      transition: all 0.5s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      width: 100%;
    }

    .btn-scan:hover {
      color: var(--brand);
      background-color: var(--blue);
      border-right: 9px solid var(--brand);
    }

    /* Download Button */
    .btn-download {
      font-weight: bold;
      height: 50px;
      padding: 10px 35px;
      border-radius: 9999px;
      color: #fff;
      background-color: var(--blue);
      border: none;
      border-right: 3px solid transparent;
      transition: all 0.5s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      width: 100%;
    }

    .btn-download:hover {
      color: var(--blue);
      background-color: var(--brand);
      border-right: 9px solid var(--blue);
    }

    /* Chart Card */
    .chart-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 15px;
      padding: 20px;
    }

    .chart-card h6 {
      color: var(--brand);
      font-weight: 700;
    }

    /* Footer */
    footer {
      padding: 20px 0;
      text-align: center;
      color: #555;
    }

    @media (max-width: 767px) {
      .scanner-card {
        padding: 25px 20px;
        margin: 10px;
      }

      .title {
        font-size: 20px;
      }

      .chart-card {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-light shadow-sm" style="background-color: milk  ; position: relative; ">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="box">

        <img src="images/Logoada.png" alt="Logo" class="logo-img">

        <!-- Text Box -->
        <div class="logo-text">
          <span class="logo-ada">ADA</span>
          <span class="logo-scanner">SCANNER</span>
        </div>
      
      </div>
      <div class="d-flex gap-2 align-items-center">
       
        <a href="http://20.198.20.235:3000/dashboard.html" class="btn btn-dashboard2">
           Go to Dashboard
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="scanner-wrapper">
    <div class="scanner-card gsap-card">

      <!-- Header -->
      <div class="text-center mb-4 gsap-item">
        <div class="d-flex align-items-center justify-content-center mb-2">
          <h2 class="title mb-0">Static Accessibility Scanner</h2>
        </div>
        <p class="subtitle">WCAG-based structural accessibility analysis</p>
      </div>

      <!-- Input Field -->
      <div class="mb-4 gsap-item">
        <label class="form-label fw-bold text-secondary">Enter URL</label>
        <input type="text" id="urlInput" class="form-control" placeholder="https://example.com">
      </div>

      <!-- Scan Button -->
      <div class="d-grid mb-3 gsap-item">
        <button id="scanBtn" class="btn-scan">
          Start Scan
        </button>
      </div>

      <!-- Progress -->
      <div id="progress" class="text-center mb-3 d-none">
        <div class="spinner-border spinner-border-sm me-2" style="color: var(--brand);" role="status"></div>
        <span class="fw-bold" style="color: var(--blue);">Scanning in progress…</span>
      </div>

      <!-- Results -->
      <div class="row mt-4 gsap-item">
        <div class="col-md-7">
          <div id="result"></div>

          <div class="d-grid mt-3 d-none" id="downloadBox">
            <button id="downloadBtn" class="btn-download">
              <i class="bi bi-download"></i> Download JSON Report
            </button>
          </div>
        </div>

        <div class="col-md-5">
          <div class="chart-card">
            <h6 class="mb-3 text-center fw-bold">Severity Breakdown</h6>
            <canvas id="severityChart"></canvas>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="gsap-footer">
    <small>&copy; 2025 ADA Compliance Scanner. All rights reserved.</small>
  </footer>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Your Logic JS (UNTOUCHED) -->
  <script src="script.js"></script>

  <!-- GSAP Entrance Animations -->
  <script>
    window.addEventListener("load", () => {

      gsap.from(".navbar", {
        y: -100,
        opacity: 0,
        duration: 1,
        ease: "power3.out"
      });

      gsap.from(".gsap-card", {
        scale: 0.8,
        y: 50,
        opacity: 0,
        duration: 1,
        delay: 0.2,
        ease: "back.out(1.2)"
      });

      gsap.from(".gsap-item", {
        y: 20,
        opacity: 0,
        duration: 0.6,
        stagger: 0.15,
        delay: 0.6,
        ease: "power2.out"
      });

      gsap.from(".gsap-footer", {
        opacity: 0,
        duration: 1,
        delay: 1.2,
        ease: "power2.out"
      });

    });
  </script>
  <script src="Modal.js"></script>

</body>
</html>
