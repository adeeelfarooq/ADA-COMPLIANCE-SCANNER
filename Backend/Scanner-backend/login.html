<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ADA Compliance Scanner</title>
  <!-- 1. Bootstrap Icons zaroor dalein (agar pehle se nahi hai) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- 2. CSS File Link karein -->
  <link rel="stylesheet" href="Modal.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Firebase SDK (Modular v9) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // YOUR EXACT FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDHexMOAju6p5balzlQUzuYjzIjT2muirI",
      authDomain: "ada-scanner-db724.firebaseapp.com",
      projectId: "ada-scanner-db724",
      storageBucket: "ada-scanner-db724.firebasestorage.app",
      messagingSenderId: "459243186978",
      appId: "1:459243186978:web:c1cf656d7377f80af9537b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Login successful!");
          window.location.href = "dashboard.html"; // Correct Redirect
        })
        .catch((error) => {
          alert(" Error: " + error.message);
        });
    });
  </script>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #1d4ed8, #fd7e14);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #fb923c;
      padding: 40px;
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      opacity: 1;
      transform: translateY(50px);
      transform: translateX(400px);

    }

    .form-control:focus {
      border-color: #1d4ed8;
      box-shadow: none;
    }

    .btn-orange {
      background-color: #1d4ed8;
      color: white;
      font-weight: 600;
      border-radius: 30px;
      width: 100%;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn-orange span {
      position: relative;
      z-index: 2;
    }

    .btn-orange::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 0;
      background-color: #fb923c;
      transition: width 1s ease-in-out;
      z-index: 1;
    }

    .btn-orange:hover {
      background-color: #1d4ed8;
      color: #fb923c;
      transition: 1s;
    }

    .toggle-text {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }

    .toggle-text a {
      color: #fd7e14;
      font-weight: 600;
      text-decoration: none;
    }

    .loginimg {
      width: 40dvw;
      height: 70dvh;
      object-fit: cover;
      z-index: -1;
      mix-blend-mode: screen;
      margin-left: 80px;
      margin-top: 70px;
      transform: scale(1.3);
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 767px) {
      .login-box {
        background: #fb923c;
        padding: 40px;
        border-radius: 50px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 420px;
        margin-top: 230px;
        opacity: 1;


        transform: scale(0.8);

      }

      .loginimg {


         width: 65dvw;
      height: 70dvh;
      object-fit: cover;
      z-index: -1;
      mix-blend-mode: screen;
      margin-left: 90px;
      margin-top: 30px;
      overflow: hidden;

      }
    }
  </style>
</head>

<body>

  <!-- Background Image -->
  <div style="position: absolute; width:100dvw ; height:100dvh;">
    <img class="loginimg" src="public/images/login.webp" >
  </div>





  <!-- Login Box -->
  <div class="login-box">
    <h3 class="mb-4 text-center text-orange">Login to ADA Scanner</h3>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" style="border-radius: 50px;" placeholder="you@example.com"
          required />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" style="border-radius: 50px;"
          placeholder="Enter password" required />
      </div>

      <button type="submit" class="btn btn-orange"><span>Login</span></button>

      <p class="mt-3 text-center">
        Don’t have an account? <a href="register.html">Register</a>
      </p>
    </form>
  </div>
  <script src="Modal.js"></script>

  <!-- GSAP Animations -->
  <script>
    gsap.from(".login-box", {
      duration: 2,
      opacity: 0,
      scale: 0,


      ease: "power3.out"
    });


    const btn = document.querySelector(".btn-orange");
    btn.addEventListener("mouseenter", () => {
      gsap.to(btn, { scale: 1.05, duration: 0.3 });
    });
    btn.addEventListener("mouseleave", () => {
      gsap.to(btn, { scale: 1, duration: 0.3 });
    });

    gsap.fromTo(
      "img[src*='login.webp']",
      {
        opacity: 0,
        scale: 1.5,
        filter: "blur(10px)"
      },
      {
        opacity: 1,
        scale: 1.2,
        filter: "blur(0px)",
        duration: 1.8,
        ease: "power4.out"
      }
    );
    if (window.innerWidth <= 767) {
  gsap.fromTo(
    "img[src*='login.webp']",
    {
      opacity: 0,
      scale:1.0,
      filter: "blur(10px)"
    },
    {
      opacity: 1,
      scale: 1.0,
      filter: "blur(0px)",
      duration: 1.8,
      ease: "power4.out"
    }
  );
}
    gsap.to("img[src*='login.webp']", {
      y: "+=15",          // neeche jayegi
      duration: 2,        // 2 sec me float hoga
      yoyo: true,         // upar neeche repeat
      repeat: -1,         // infinite
      ease: "sine.inOut"  // smooth floating
    });

  </script>

</body>

</html>
